<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Save Pinned</title>
	<link href="style.css" rel="stylesheet">
</head>
<body>
<h2>Save <span>Save current pinned tabs.</span></h2>
<p class="save-row">
	<input id="save-name" type="text" name="pinname" placeholder="Enter a name for set..." maxlength="30"><button id="save-button">Save</button>
</p>
<h2>Load<span>Load or delete a pinned tab set.</span></h2>
<div id="load-area">
	<div id="placeholder">There are no saved tab sets</div>
</div>
<dialog id="delete-dialog" aria-labelledby="delete-dialog-title" aria-describedby="delete-dialog-description">
	<form method="dialog">
		<h3 id="delete-dialog-title">Delete tab set?</h3>
		<p id="delete-dialog-description">This action cannot be undone.</p>
		<div class="dialog-actions">
			<button value="cancel" autofocus>Cancel</button>
			<button value="delete" class="dialog-delete">Delete</button>
		</div>
	</form>
</dialog>
<dialog id="edit-dialog" aria-labelledby="edit-dialog-title">
	<form method="dialog">
	<h3 id="edit-dialog-title">Edit tab set</h3>
	<label for="edit-name">Name</label>
	<input id="edit-name" type="text" maxlength="30">
	<label for="edit-urls">URLs</label>
	<p>Enter one URL per line. Add, change, reorder, or remove entries.</p>
	<textarea id="edit-urls" rows="8"></textarea>
	<p id="edit-status" role="status"></p>
	<div class="dialog-actions">
		<button value="cancel">Cancel</button>
		<button id="save-edit-button" type="button">Save changes</button>
	</div>
	</form>
</dialog>
<script src="popup.js" type="module"></script>
</body>
</html>
