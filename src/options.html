<!DOCTYPE html>

<html>
  <head>
    <title>Save Pinned Tabs - Options</title>
    <meta charset="utf-8" />
    <link href="style.css" rel="stylesheet">
    <style>
      .container {
        padding: 10px 20px 10px 20px;
      }
      .section {
        margin: 30px 10px 30px 10px;
      }
      .color-red {
        color: red;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>Save Pinned Tabs - Options</h1>
      <hr>
      <div class="section">
        <h2>Autoload Scope</h2>
        <p>Choose which browser windows receive the Autoload tab set.</p>
        <label>
          <input type="radio" name="autoload-scope" value="first-window" disabled>
          First browser window only
        </label>
        <br>
        <label>
          <input type="radio" name="autoload-scope" value="every-window" disabled>
          Every new browser window
        </label>
      </div>

      <div class="section">
        <h2>Export Tab Sets</h1>
        <p>Save all your current tab sets to a file.</p>
        <button id="export-button">Export</button>
      </div>

      <div class="section">
        <h2>Import Tab Sets</h1>
        <p>Import tab sets from a previous export.</p>
        <p class="color-red">Warning: this will overwrite any existing tab sets with the same name.</p>
        <input id="import-input" type="file" name="importfile" accept="application/json" />
        <button id="import-button">Import</button>
      </div>

      <dialog id="notification-dialog" aria-labelledby="notification-message">
        <form method="dialog">
          <p id="notification-message"></p>
          <div class="dialog-actions">
            <button value="close" autofocus>OK</button>
          </div>
        </form>
      </dialog>

      <script src="lib/FileSaver.min.js"></script>
      <script src="lib/validate_sets_schema.min.js"></script>
      <script src="options.js" type="module"></script>
    </div>
  </body>
</html>
