<!DOCTYPE html>

<html>
  <head>
    <title>Save Pinned Tabs - Options</title>
    <meta charset="utf-8" />
    <link href="../styles/extension.css" rel="stylesheet">
    <style>
      .container {
        padding: 10px 20px 10px 20px;
      }
      .section {
        margin: 30px 10px 30px 10px;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>Save Pinned Tabs - Options</h1>
      <hr>
      <div class="section">
        <h2>Keyboard Shortcuts</h2>
        <p>Choose a saved tab set for each shortcut.</p>
        <p><label><span data-shortcut-label="load-set-1">Shortcut 1</span> <select data-shortcut-command="load-set-1"></select></label></p>
        <p><label><span data-shortcut-label="load-set-2">Shortcut 2</span> <select data-shortcut-command="load-set-2"></select></label></p>
        <p><label><span data-shortcut-label="load-set-3">Shortcut 3</span> <select data-shortcut-command="load-set-3"></select></label></p>
        <p><label><span data-shortcut-label="load-set-4">Shortcut 4</span> <select data-shortcut-command="load-set-4"></select></label></p>
        <p id="options-status" class="operation-status" role="status" aria-live="polite"></p>
      </div>

      <div class="section">
        <h2>Export Tab Sets</h2>
        <p>Save all your current tab sets to a file.</p>
        <button id="export-button">Export</button>
      </div>

      <div class="section">
        <h2>Import Tab Sets</h2>
        <p>Import tab sets from a previous export. Imported sets keep separate identities.</p>
        <input id="import-input" type="file" name="importfile" accept="application/json" />
        <button id="import-button">Import</button>
      </div>


      <script src="../lib/FileSaver.min.js"></script>
      <script src="../lib/validate_sets_schema.min.js"></script>
      <script src="options.js" type="module"></script>
    </div>
  </body>
</html>
